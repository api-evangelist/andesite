aid: andesite
name: Andesite
description: 'Andesite is a cybersecurity company building a Human+AI Security Operations
  Center (SOC) platform that connects human analysts, AI agents, and security data to
  automate and accelerate threat detection, investigation, and response. Its Decision
  Fabric connects data silos and organizational context, while Evidentiary AI provides
  audit trails for every AI-driven action. Andesite deploys as SaaS or self-managed,
  carries FedRAMP High Authorization and SOC 2 Type II compliance, and is a General
  Catalyst portfolio company operating in the defense and government sector.'
